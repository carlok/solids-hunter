# Podman Compose: official images only — no COPY of the app into images.
# The repo is bind-mounted at /app; Node deps live in named volumes (not on the host).

volumes:
  node_modules:
  npm_cache:

services:
  web:
    image: docker.io/nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro,Z
      - ./deploy/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro,Z

  test:
    image: docker.io/node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:Z
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    environment:
      npm_config_update_notifier: "false"

  build:
    image: docker.io/node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:Z
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    environment:
      npm_config_update_notifier: "false"
